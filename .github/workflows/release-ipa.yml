# Builds an unsigned IPA with app/build-ipa.sh and publishes it as a GitHub release.
name: Release IPA

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/release-ipa.yml']
  workflow_dispatch:

jobs:
  ipa:
    # The Xcode build the app is developed with (27.2, 27B52); the image's default is 27.1.
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: app/build-ipa.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' .build/ipa/Payload/HDrezka.app/Info.plist)
          {
            git log -1 --format=%b
            echo "Unsigned build of $GITHUB_SHA made with $(xcodebuild -version | head -1)."
            echo "Sideload it with AltStore, SideStore, Sideloadly or TrollStore, which sign it on install."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$version-ci.$GITHUB_RUN_NUMBER" .build/ipa/HDrezka.ipa --target "$GITHUB_SHA" \
            --title "$(git log -1 --format=%s)" --notes-file "$RUNNER_TEMP/notes.md"
